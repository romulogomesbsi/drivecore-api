spring:
  application:
    name: drivecore-api
  profiles:
    active: homologacao
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:postgresql://localhost:5432/drivecore
    username: postgres
    password: 150366

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

logging:
  file:
    name: app.log
  level:
    root: warn
    io:
      romulogomesbsi: trace
    org:
      springframework:
        web: debug

management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: '*'

# production
---
spring:
  config:
    activate:
      on-profile: homologacao
  jpa:
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/drivecore-hml
    username: postgres
    password: 150366

# production
---
spring:
  config:
    activate:
      on-profile: production
  jpa:
    show-sql: false


